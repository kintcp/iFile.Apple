name: build-macos-app

run-name: Build for macOS

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-macos
  # Don't cancel a release run halfway through uploading or notarizing.
  cancel-in-progress: ${{ github.ref != 'refs/heads/prod' }}

permissions:
  contents: write

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: 🛠️ Checkout Code
        uses: actions/checkout@v7
        with:
          repository: saltpi/iFile
          ref: 'main'
          token: ${{ secrets.REPO_TOKEN }}
          submodules: recursive

      - name: ⚙️ Run XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen

      - name: 🔨 Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "~26.4.0"

      - name: 🧪 Run Tests
        uses: saltpi/xcodebuild@main
        with:
          project: iFile.xcodeproj
          scheme: iFileMac
          configuration: Debug
          sdk: macosx
          destination: platform=macOS
          action: test

      - name: 📤 Upload Logs
        uses: actions/upload-artifact@v7
        if: ${{ failure() || cancelled() }}
        with:
          name: logs-test
          include-hidden-files: true
          path: .build/*.log
          if-no-files-found: warn

  release:
    needs: test
    if: github.ref == 'refs/heads/prod'
    runs-on: macos-26
    # TestFlight processing and notarization can each take a while.
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: 🛠️ Checkout Code
        uses: actions/checkout@v7
        with:
          repository: saltpi/iFile
          ref: 'main'
          token: ${{ secrets.REPO_TOKEN }}
          submodules: recursive

      - name: ⚙️ Run XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen

      - name: 🔨 Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "~26.4.0"

      - name: 🔑 Import Code Signing Certificates
        # One .p12 with Apple Distribution, Mac Installer Distribution and
        # Developer ID Application.
        uses: saltpi/import-codesign-certs@main
        with:
          p12-file-base64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          p12-password: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}

      - name: 📄 Download Provisioning Profiles
        id: profiles
        # No profile-type: fetches both the AppStore (TestFlight) and
        # DeveloperID (DMG) profiles for the bundle.
        uses: saltpi/download-provisioning-profiles@main
        with:
          bundle-id: cn.saltpi.app.iFile
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: 🔍 Check Provisioning Profiles
        env:
          PROFILES: ${{ steps.profiles.outputs.profiles }}
        run: |
          set -euo pipefail
          for name in "AppStore codes.orj.ExampleMac" "DeveloperID codes.orj.ExampleMac"; do
            if ! jq -e --arg name "$name" 'any(.[]; .name == $name)' <<<"$PROFILES" >/dev/null; then
              echo "::error::No ACTIVE provisioning profile \"$name\"; see \"One-time Apple setup\" in README.md"
              exit 1
            fi
          done

      - name: 🏷️ Read Version
        id: version
        run: |
          set -euo pipefail
          version=$(awk -F= '/^MARKETING_VERSION/{gsub(/[ \t]/,"",$2); print $2}' Config/Shared.xcconfig)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: 📦 Archive and Export for App Store
        id: build
        uses: saltpi/xcodebuild@main
        with:
          project: iFile.xcodeproj
          scheme: iFileMac
          sdk: macosx
          action: archive
          archive-path: .build/Artifacts/iFile.xcarchive
          export-options-plist: .meta/config/macos/export-options.plist
          export-path: .build/Artifacts/app-store
          # run_attempt makes a re-run upload a new, higher build instead of
          # being rejected as a duplicate.
          build-number: ${{ github.run_number }}.${{ github.run_attempt }}

      # TestFlight runs before the DMG so a notary-service outage can't block
      # it. To never upload twice instead, move this step after Notarize DMG.
      - name: 🚀 Upload TestFlight Build
        uses: saltpi/upload-testflight-build@main
        with:
          app-path: ${{ steps.build.outputs.pkg-path }}
          app-type: macos
          # The default appstore-api backend only uploads .ipa files.
          backend: altool
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: 🔏 Export Developer ID
        id: devid
        uses: saltpi/xcodebuild@main
        with:
          scheme: iFileMac
          action: export
          archive-path: ${{ steps.build.outputs.archive-path }}
          export-options-plist: ExportOptions-DeveloperID.plist
          export-path: .build/Artifacts/developer-id

      - name: 💿 Create DMG
        id: dmg
        uses: Apple-Actions/create-dmg@v1
        with:
          app-path: ${{ steps.devid.outputs.app-path }}
          dmg-path: .build/dmg/iFile-${{ steps.version.outputs.version }}-${{ github.run_number }}.dmg
          team-id: ER9FN723RR

      - name: 🛡️ Notarize DMG
        uses: Apple-Actions/notarize@v1
        with:
          path: ${{ steps.dmg.outputs.dmg-path }}
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: 📤 Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: iFile-dmg
          path: ${{ steps.dmg.outputs.dmg-path }}
          if-no-files-found: error

      - name: 🎉 Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          DMG: ${{ steps.dmg.outputs.dmg-path }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "v${VERSION}-${GITHUB_RUN_NUMBER}" "$DMG" \
            --target "$GITHUB_SHA" \
            --title "iFile ${VERSION} (${GITHUB_RUN_NUMBER})" \
            --generate-notes

      - name: 📤 Upload Logs
        uses: actions/upload-artifact@v7
        if: ${{ failure() || cancelled() }}
        with:
          name: logs-release
          include-hidden-files: true
          path: .build/*.log
          if-no-files-found: warn
